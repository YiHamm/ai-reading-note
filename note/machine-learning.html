<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="機器學習（Machine Learning）讓電腦從資料中學習規律，而不是為每種情況逐一撰寫規則。"><title>什麼是機器學習？｜AI 學習筆記</title><link rel="stylesheet" href="../css/style.css"></head><body><header><div class="wrap"><p>AI 論文閱讀與學習筆記</p></div></header><main><article class="article"><a class="back" href="../index.html">← 返回首頁</a><p class="tag">AI 基礎</p><h1>什麼是機器學習？</h1><p><strong>摘要：</strong>機器學習（Machine Learning）讓電腦從資料中學習規律，而不是為每種情況逐一撰寫規則。</p><h2>核心概念</h2><p>常見流程包括收集資料、選擇模型、訓練、驗證與測試。</p><h2>簡單例子</h2><p>例如使用已標記的貓狗圖片訓練分類器，再評估它在未見過圖片上的表現。</p><h2>限制與提醒</h2><p>資料品質與偏差會影響模型；訓練準確率高不代表泛化能力好。</p><h2>延伸閱讀</h2><p>建議使用相關教科書、原始論文或官方教學文件進一步查證。</p></article></main><footer>依 AGENTS.md 統一維護文章格式</footer></body></html>
